name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Copy all site files
        run: |
          mkdir -p public

          # 复制所有 HTML 页面
          cp index.html knowledge.html path.html projects.html \
             workshop.html blueprint.html resources.html public/

          # 复制资源目录
          cp -r css js public/

          # 复制 SEO 资产
          cp sitemap.xml robots.txt humans.txt site.webmanifest public/
          cp favicon.svg og-image.png public/
          cp favicon-16x16.png favicon-32x32.png public/
          cp favicon-180x180.png apple-touch-icon.png public/
          cp favicon-192x192.png favicon-512x512.png public/

          echo "📂 部署文件清单:"
          ls -la public/
          echo ""
          echo "📂 部署目录树:"
          find public/ -type f | sort

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
